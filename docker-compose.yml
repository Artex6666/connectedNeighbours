services:

  # ── Databases ────────────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: cn_mongodb
    restart: unless-stopped
    # Reachable by the backend over the compose network only; not published to
    # the host (bind to localhost if you need to inspect it directly).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bobconnect
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Disabled by default (NEO4J_ENABLED=false). Start with `--profile graph`.
  neo4j:
    image: neo4j:5
    container_name: cn_neo4j
    profiles: ["graph"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Browser UI
      - "127.0.0.1:7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────────────────────

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    container_name: cn_back
    restart: unless-stopped
    # Published on localhost only — the host nginx reverse proxy fronts it.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/bobconnect
      NEO4J_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:80}
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        # Baked into the static bundle; must be the public API origin since the
        # browser (not the container) makes these calls.
        VITE_API_BASE_URL: ${PUBLIC_URL:-http://localhost:3000}/api/v1
    container_name: cn_front
    restart: unless-stopped
    # Published on localhost only — the host nginx reverse proxy fronts it.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - back

volumes:
  mongodb_data:
  neo4j_data:
